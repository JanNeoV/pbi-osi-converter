version: 2
models:
- name: time_spine
  time_spine:
    standard_granularity_column: date_day
  columns:
  - name: date_day
    granularity: day
semantic_models:
- name: orders
  model: ref('orders')
  defaults:
    agg_time_dimension: session_date
  entities:
  - name: order
    type: primary
    expr: order_id
  dimensions:
  - name: session_date
    type: time
    type_params:
      time_granularity: day
  - name: order_status
    type: categorical
  measures:
  - name: revenue
    agg: sum
    expr: amount_eur
metrics:
- name: paid_revenue
  label: Elementary unfiltered sum (not business Paid Revenue)
  type: simple
  type_params:
    measure: revenue
