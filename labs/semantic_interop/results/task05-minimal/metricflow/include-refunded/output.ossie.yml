version: 0.2.0.dev0
name: conversion_demo
datasets:
- name: sessions
  source: '"benchmark"."main"."sessions"'
  primary_key:
  - session_id
  fields:
  - name: session
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_id
  - name: session_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_date
    dimension:
      is_time: true
  - name: sales_channel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sales_channel
    dimension:
      is_time: false
  - name: is_eligible
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: is_eligible
    dimension:
      is_time: false
  - name: session_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_id
- name: orders
  source: '"benchmark"."main"."orders"'
  primary_key:
  - order_id
  fields:
  - name: order
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
  - name: session
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_id
  - name: session_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_date
    dimension:
      is_time: true
  - name: order_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_status
    dimension:
      is_time: false
  - name: converted_session_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_id
  - name: order_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
  - name: revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount_eur
relationships:
- name: orders__sessions__session
  from: orders
  to: sessions
  from_columns:
  - session_id
  to_columns:
  - session_id
metrics:
- name: eligible_sessions
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN session__is_eligible = true THEN sessions.session_id
        END)
  description: ''
- name: converted_sessions_base
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN session__is_eligible = true AND order__order_status
        = 'paid' THEN orders.session_id END)
  description: ''
- name: paid_revenue_base
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN session__is_eligible = true AND order__order_status
        IN ('paid', 'refunded') THEN orders.amount_eur END)
  description: ''
- name: paid_order_count_base
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT CASE WHEN session__is_eligible = true AND order__order_status
        = 'paid' THEN orders.order_id END)
  description: ''
- name: conversion_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (COALESCE(COUNT(DISTINCT CASE WHEN session__is_eligible = true AND
        order__order_status = 'paid' THEN orders.session_id END), 0) + 0 * COUNT(DISTINCT
        CASE WHEN session__is_eligible = true THEN sessions.session_id END)) / (COUNT(DISTINCT
        CASE WHEN session__is_eligible = true THEN sessions.session_id END))
  description: ''
- name: average_paid_order_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: (SUM(CASE WHEN session__is_eligible = true AND order__order_status
        IN ('paid', 'refunded') THEN orders.amount_eur END) + 0 * COUNT(DISTINCT CASE
        WHEN session__is_eligible = true THEN sessions.session_id END)) / (COALESCE(COUNT(DISTINCT
        CASE WHEN session__is_eligible = true AND order__order_status = 'paid' THEN
        orders.order_id END), 0) + 0 * COUNT(DISTINCT CASE WHEN session__is_eligible
        = true THEN sessions.session_id END))
  description: ''
- name: converted_sessions
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COALESCE(COUNT(DISTINCT CASE WHEN session__is_eligible = true AND
        order__order_status = 'paid' THEN orders.session_id END), 0) + 0 * COUNT(DISTINCT
        CASE WHEN session__is_eligible = true THEN sessions.session_id END)
  description: ''
- name: paid_revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN session__is_eligible = true AND order__order_status
        IN ('paid', 'refunded') THEN orders.amount_eur END) + 0 * COUNT(DISTINCT CASE
        WHEN session__is_eligible = true THEN sessions.session_id END)
  description: ''
- name: paid_order_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COALESCE(COUNT(DISTINCT CASE WHEN session__is_eligible = true AND
        order__order_status = 'paid' THEN orders.order_id END), 0) + 0 * COUNT(DISTINCT
        CASE WHEN session__is_eligible = true THEN sessions.session_id END)
  description: ''
