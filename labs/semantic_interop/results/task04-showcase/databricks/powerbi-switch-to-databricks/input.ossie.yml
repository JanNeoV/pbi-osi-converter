version: 0.2.0.dev0
name: ConversionDemoSwitch
datasets:
- name: Sessions
  source: Sessions
  primary_key:
  - session_id
  fields:
  - name: session_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_id
    datatype: Integer
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  - name: session_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_date
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "formatString": "yyyy-MM-dd", "summarizeBy": "none"}'
  - name: session_month
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_month
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "formatString": "yyyy-MM", "summarizeBy": "none"}'
  - name: sales_channel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sales_channel
    datatype: String
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "isHidden": true, "summarizeBy": "none"}'
  - name: is_eligible
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: is_eligible
    datatype: Boolean
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  - name: exclusion_reason
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: exclusion_reason
    datatype: String
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "partitions": [{"mode": "import", "name": "Sessions", "source": {"expression": "SessionsData", "type": "m"}}]}'
- name: Orders
  source: Orders
  primary_key:
  - order_id
  fields:
  - name: order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
    datatype: Integer
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  - name: session_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: session_id
    datatype: Integer
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  - name: order_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_date
    datatype: Date
    dimension:
      is_time: true
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "formatString": "yyyy-MM-dd", "summarizeBy": "none"}'
  - name: amount_eur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount_eur
    datatype: Decimal
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "formatString": "#,0.00 \"EUR\"", "summarizeBy": "sum"}'
  - name: order_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_status
    datatype: String
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "partitions": [{"mode": "import", "name": "Orders", "source": {"expression": "OrdersData", "type": "m"}}]}'
- name: Sales Channel
  source: Sales Channel
  primary_key:
  - sales_channel
  fields:
  - name: sales_channel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sales_channel
    datatype: String
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "partitions": [{"mode": "import", "name": "Sales Channel", "source": {"expression": "Table.Distinct(Table.SelectColumns(SessionsData, {\"sales_channel\"}))", "type": "m"}}]}'
- name: KPI Selector
  source: KPI Selector
  fields:
  - name: KPI
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: KPI
    datatype: String
    custom_extensions:
    - vendor_name: POWER_BI
      data: '{"_v": 2, "summarizeBy": "none"}'
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "partitions": [{"mode": "import", "name": "KPI Selector", "source": {"expression": "#table(type table [KPI = text], {{\"Conversion Rate\"}, {\"Paid Revenue\"}})", "type": "m"}}]}'
relationships:
- name: Sessions_sales_channel_to_Sales Channel_sales_channel
  from: Sessions
  to: Sales Channel
  from_columns:
  - sales_channel
  to_columns:
  - sales_channel
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "crossFilteringBehavior": "oneDirection", "fromCardinality": "many", "isActive": true, "name": "sessions_channel", "normalizedEndpoints": ["Sessions", "sales_channel", "Sales Channel", "sales_channel"], "toCardinality": "one"}'
- name: Orders_session_id_to_Sessions_session_id
  from: Orders
  to: Sessions
  from_columns:
  - session_id
  to_columns:
  - session_id
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "crossFilteringBehavior": "oneDirection", "fromCardinality": "many", "isActive": true, "name": "orders_session", "normalizedEndpoints": ["Orders", "session_id", "Sessions", "session_id"], "toCardinality": "one"}'
metrics:
- name: Eligible Sessions
  expression:
    dialects:
    - dialect: DAX
      expression: |-
        COALESCE(
            CALCULATE(
                DISTINCTCOUNT(Sessions[session_id]),
                KEEPFILTERS(Sessions[is_eligible] = TRUE()),
                KEEPFILTERS(Sessions[session_date] >= DATE(2026, 1, 1)),
                KEEPFILTERS(Sessions[session_date] < DATE(2026, 3, 1))
            ),
            0
        )
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "formatString": "#,0", "isHidden": true, "table": "Sessions"}'
- name: Converted Sessions
  expression:
    dialects:
    - dialect: DAX
      expression: |-
        COALESCE(
            CALCULATE(
                DISTINCTCOUNT(Orders[session_id]),
                KEEPFILTERS(Sessions[is_eligible] = TRUE()),
                KEEPFILTERS(Sessions[session_date] >= DATE(2026, 1, 1)),
                KEEPFILTERS(Sessions[session_date] < DATE(2026, 3, 1)),
                KEEPFILTERS(Orders[order_status] = "paid"),
                KEEPFILTERS(Orders[order_date] < DATE(2026, 3, 1))
            ),
            0
        )
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "formatString": "#,0", "isHidden": true, "table": "Sessions"}'
- name: Conversion Rate
  expression:
    dialects:
    - dialect: DAX
      expression: DIVIDE([Converted Sessions], [Eligible Sessions])
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "formatString": "0.0%", "table": "Sessions"}'
- name: Paid Revenue
  expression:
    dialects:
    - dialect: DAX
      expression: |-
        CALCULATE(
            SUM(Orders[amount_eur]),
            KEEPFILTERS(Sessions[is_eligible] = TRUE()),
            KEEPFILTERS(Sessions[session_date] >= DATE(2026, 1, 1)),
                KEEPFILTERS(Sessions[session_date] < DATE(2026, 3, 1)),
            KEEPFILTERS(Orders[order_status] = "paid"),
            KEEPFILTERS(Orders[order_date] < DATE(2026, 3, 1))
        )
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "formatString": "#,0.00 \"EUR\"", "table": "Sessions"}'
- name: Selected KPI
  expression:
    dialects:
    - dialect: DAX
      expression: |-
        SWITCH(
            SELECTEDVALUE('KPI Selector'[KPI], "Conversion Rate"),
            "Conversion Rate", [Conversion Rate],
            "Paid Revenue", [Paid Revenue],
            BLANK()
        )
  custom_extensions:
  - vendor_name: POWER_BI
    data: '{"_v": 2, "formatString": "0.0%", "formatStringDefinition": {"expression": "SWITCH(\n    SELECTEDVALUE(''KPI Selector''[KPI], \"Conversion Rate\"),\n    \"Conversion Rate\", \"0.0%\",\n    \"Paid Revenue\", \"#,0.00 \"\"EUR\"\"\",\n    \"General Number\"\n)"}, "table": "Sessions"}'
custom_extensions:
- vendor_name: POWER_BI
  data: '{"_v": 2, "culture": "en-US", "defaultPowerBIDataSourceVersion": "powerBI_V3", "document": {"compatibilityLevel": 1601}, "expressions": [{"expression": "\"C:/github/pbi-osi-converter/labs/semantic_interop/fixtures/conversion_demo/data\" meta [IsParameterQuery=true, Type=\"Text\", IsParameterQueryRequired=true]", "kind": "m", "name": "FixtureRoot"}, {"expression": "let\n    Csv = Csv.Document(File.Contents(FixtureRoot & \"/sessions.csv\"), [Delimiter=\",\", Columns=5, Encoding=65001, QuoteStyle=QuoteStyle.Csv]),\n    Headers = Table.PromoteHeaders(Csv, [PromoteAllScalars=true]),\n    Typed = Table.TransformColumnTypes(Headers, {{\"session_id\", Int64.Type}, {\"session_date\", type date}, {\"sales_channel\", type text}, {\"is_eligible\", type logical}, {\"exclusion_reason\", type text}}, \"en-US\"),\n    WithMonth = Table.AddColumn(Typed, \"session_month\", each Date.StartOfMonth([session_date]), type date)\nin\n    WithMonth", "kind": "m", "name": "SessionsData"}, {"expression": "let\n    Csv = Csv.Document(File.Contents(FixtureRoot & \"/orders.csv\"), [Delimiter=\",\", Columns=5, Encoding=65001, QuoteStyle=QuoteStyle.Csv]),\n    Headers = Table.PromoteHeaders(Csv, [PromoteAllScalars=true]),\n    Typed = Table.TransformColumnTypes(Headers, {{\"order_id\", Int64.Type}, {\"session_id\", Int64.Type}, {\"order_date\", type date}, {\"amount_eur\", Currency.Type}, {\"order_status\", type text}}, \"en-US\")\nin\n    Typed", "kind": "m", "name": "OrdersData"}], "sourceQueryCulture": "en-US"}'
