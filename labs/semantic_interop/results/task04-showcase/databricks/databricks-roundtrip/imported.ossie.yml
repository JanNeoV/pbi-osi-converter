version: "0.2.0.dev0"
name: "conversion_demo_databricks"
description: "Candidate session-cohort conversion metrics, observed before 2026-03-01\
  \ exclusive; runtime NOT_EXECUTED"
datasets:
- name: "conversion_demo_databricks"
  source: "SELECT s.session_id, s.session_date, s.sales_channel, s.is_eligible,\n\
    \       o.order_id, o.order_date, o.amount_eur, o.order_status\nFROM demo.semantic_interop.sessions\
    \ AS s\nLEFT JOIN demo.semantic_interop.orders AS o\n  ON s.session_id = o.session_id\n\
    \ AND o.order_date < DATE '2026-03-01'\nWHERE s.session_date >= DATE '2026-01-01'\n\
    \  AND s.session_date < DATE '2026-03-01'\n"
  fields:
  - name: "sales_channel"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "sales_channel"
    description: "One channel per originating session"
  - name: "session_month"
    expression:
      dialects:
      - dialect: "OSSIE_SQL_2026"
        expression: "CAST(DATE_TRUNC('MONTH', session_date) AS DATE)"
    description: "Session cohort month, not transaction month"
metrics:
- name: "eligible_sessions"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "COUNT(DISTINCT session_id)"
  description: "Includes eligible sessions without orders; distinct survives multiple\
    \ orders"
- name: "converted_sessions"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "COUNT(DISTINCT session_id) FILTER (WHERE order_status = 'paid')"
- name: "conversion_rate"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "CAST(COUNT(DISTINCT session_id) FILTER (WHERE order_status = 'paid')\
        \ AS DOUBLE) / NULLIF(COUNT(DISTINCT session_id), 0)"
  description: "Recompute the aggregate ratio at the requested grain; zero denominator\
    \ returns NULL"
- name: "paid_revenue"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "SUM(amount_eur) FILTER (WHERE order_status = 'paid')"
  description: "EUR attributed to session month; empty paid sums remain NULL"
- name: "paid_order_count"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "COUNT(DISTINCT order_id) FILTER (WHERE order_status = 'paid')"
- name: "average_paid_order_value"
  expression:
    dialects:
    - dialect: "DATABRICKS"
      expression: "(SUM(amount_eur) FILTER (WHERE order_status = 'paid')) / NULLIF(COUNT(DISTINCT\
        \ order_id) FILTER (WHERE order_status = 'paid'), 0)"
  description: "Paid revenue divided by paid orders, not converted sessions"
custom_extensions:
- vendor_name: "DATABRICKS"
  data: "{\"_v\": 1, \"filter\": \"is_eligible = true\"}"
