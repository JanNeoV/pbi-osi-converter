version: "1.1"
source: "SELECT s.session_id, s.session_date, s.sales_channel, s.is_eligible,\n  \
  \     o.order_id, o.order_date, o.amount_eur, o.order_status\nFROM demo.semantic_interop.sessions\
  \ AS s\nLEFT JOIN demo.semantic_interop.orders AS o\n  ON s.session_id = o.session_id\n\
  \ AND o.order_date < DATE '2026-03-01'\nWHERE s.session_date >= DATE '2026-01-01'\n\
  \  AND s.session_date < DATE '2026-03-01'"
comment: "Candidate session-cohort conversion metrics, observed before 2026-03-01\
  \ exclusive; runtime NOT_EXECUTED"
filter: "is_eligible = true"
dimensions:
- name: "sales_channel"
  expr: "sales_channel"
  comment: "One channel per originating session"
- name: "session_month"
  expr: "CAST(DATE_TRUNC('MONTH', session_date) AS DATE)"
  comment: "Session cohort month, not transaction month"
measures:
- name: "eligible_sessions"
  expr: "COUNT(DISTINCT session_id)"
  comment: "Includes eligible sessions without orders; distinct survives multiple\
    \ orders"
- name: "converted_sessions"
  expr: "COUNT(DISTINCT session_id) FILTER (WHERE order_status = 'paid')"
- name: "conversion_rate"
  expr: "CAST(COUNT(DISTINCT session_id) FILTER (WHERE order_status = 'paid') AS DOUBLE)\
    \ / NULLIF(COUNT(DISTINCT session_id), 0)"
  comment: "Recompute the aggregate ratio at the requested grain; zero denominator\
    \ returns NULL"
- name: "paid_revenue"
  expr: "SUM(amount_eur) FILTER (WHERE order_status = 'paid')"
  comment: "EUR attributed to session month; empty paid sums remain NULL"
- name: "paid_order_count"
  expr: "COUNT(DISTINCT order_id) FILTER (WHERE order_status = 'paid')"
- name: "average_paid_order_value"
  expr: "(SUM(amount_eur) FILTER (WHERE order_status = 'paid')) / NULLIF(COUNT(DISTINCT\
    \ order_id) FILTER (WHERE order_status = 'paid'), 0)"
  comment: "Paid revenue divided by paid orders, not converted sessions"
