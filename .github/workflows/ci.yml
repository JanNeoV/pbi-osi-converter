name: Public offline proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check public repository
        run: python scripts/check_public_repository.py
      - name: Reproduce captured conversion gap
        run: python semantic_poc/run_pbi_trial_v2_audit.py --check --json
      - name: Reproduce offline review
        run: python semantic_poc/run_demo.py --clean --check
      - name: Reproduce agent-guided review
        run: python semantic_poc/run_agent_guided_conversion_demo.py --clean --check
      - name: Reproduce synchronized maintenance
        run: python semantic_poc/run_end_to_end_demo.py --clean --check
      - name: Check narrated wrapper
        run: python demo/run_public_demo.py --check
      - name: Run exported non-live tests
        run: python -m pytest -q -m "not live_agent" --basetemp .tmp/pytest-public
      - name: Verify protected inputs after all runs
        run: python scripts/check_public_repository.py --after-demo

