[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triathlon-semantic-contract-poc"
version = "0.1.0"
description = "Offline semantic-assurance POC for a captured Power BI-to-Snowflake conversion."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
  "pydantic>=2.12,<3",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
semantic-agent = "semantic_poc.agent.cli:main"

[project.urls]
Repository = "https://github.com/JanNeoV/pbi-osi-converter"
Issues = "https://github.com/JanNeoV/pbi-osi-converter/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["semantic_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests", "semantic_poc/tests"]
norecursedirs = ["build", "dist", ".tmp"]
addopts = "-p no:cacheprovider"
