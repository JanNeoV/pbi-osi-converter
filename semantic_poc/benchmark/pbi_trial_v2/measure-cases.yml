  - case_id: pbiv2_030
    name: Weighted Bike Speed KM/H
    operation: ADD
    dax: >-
      VAR TimedResults =
          FILTER(FCT_RESULT, FCT_RESULT[SUM_OF_BIKE_SECONDS] > 0)
      VAR NominalBikeKM =
          SUMX(TimedResults, RELATED(DIM_DISTANCE[NOMINAL_BIKE_KM]))
      VAR BikeSeconds =
          SUMX(TimedResults, FCT_RESULT[SUM_OF_BIKE_SECONDS])
      RETURN
          DIVIDE(NominalBikeKM, DIVIDE(BikeSeconds, 3600))
    description: EXPERIMENTAL_BENCHMARK_ONLY — Nominal kilometres divided by bike hours over the identical positive-time result population.
