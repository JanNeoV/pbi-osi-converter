  - case_id: pbiv2_040
    name: All-Leg Split vs Result Delta Seconds
    operation: ADD
    dax: >-
      IF(
          ISFILTERED(FCT_SPLIT[LEG]),
          BLANK(),
          VAR VisibleResultIDs = VALUES(FCT_SPLIT[RESULT_ID])
          VAR VisibleResultCount = COUNTROWS(VisibleResultIDs)
          VAR ResultComponentSeconds =
              CALCULATE(
                  [Total Recorded Seconds],
                  KEEPFILTERS(
                      TREATAS(
                          VisibleResultIDs,
                          FCT_RESULT[RESULT_ID]
                      )
                  )
              )
          RETURN
              IF(
                  VisibleResultCount = 0,
                  BLANK(),
                  [Split Time Seconds] - ResultComponentSeconds
              )
      )
    description: EXPERIMENTAL_BENCHMARK_ONLY — All-leg split seconds less matching result-component seconds; blank with leg filters or no keys.
