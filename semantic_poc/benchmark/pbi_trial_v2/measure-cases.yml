    operation: ADD
    dax: COUNTROWS(FCT_RESULT)
    description: EXPERIMENTAL_BENCHMARK_ONLY — Number of race-result rows under the current filter context.
    display_folder: 01 Core Controls
    format_string: "#,0"
    source_unit: row
    target_unit: count
    semantic_status: CORRECT
    expected_review_category: EXACT_CONVERSION
    expected_local_parser_supported: true
    intentional_defects: []
    correction:

