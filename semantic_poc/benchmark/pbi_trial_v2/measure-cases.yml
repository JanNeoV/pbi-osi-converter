  - case_id: pbiv2_025
    name: Complete SBR Population StdDev Seconds
    operation: ADD
    dax: >-
      VAR CompleteRows =
          FILTER(
              FCT_RESULT,
              FCT_RESULT[IS_VALID_SBR_FINISHER] = TRUE()
                  && NOT(ISBLANK(FCT_RESULT[SUM_OF_SWIM_SECONDS]))
                  && NOT(ISBLANK(FCT_RESULT[SUM_OF_BIKE_SECONDS]))
                  && NOT(ISBLANK(FCT_RESULT[SUM_OF_RUN_SECONDS]))
          )
      VAR CompleteRowCount = COUNTROWS(CompleteRows)
      RETURN
          IF(
              CompleteRowCount < 2,
              BLANK(),
              STDEVX.P(
                  CompleteRows,
                  FCT_RESULT[SUM_OF_SWIM_SECONDS]
                      + FCT_RESULT[SUM_OF_BIKE_SECONDS]
                      + FCT_RESULT[SUM_OF_RUN_SECONDS]
              )
          )
    description: EXPERIMENTAL_BENCHMARK_ONLY — Population standard deviation of complete SBR seconds; blank with fewer than two rows.
    display_folder: 03 Statistics and Units
    format_string: "#,0.00"
    source_unit: seconds
    target_unit: seconds
