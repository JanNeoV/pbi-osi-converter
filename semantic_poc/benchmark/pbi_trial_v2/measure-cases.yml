schema_version: 2
benchmark_name: pbi_trial_measure_conversion_v2
source_project:
  project_file: pbi_trial.pbip
  semantic_model_dir: pbi_trial.SemanticModel
  report_dir: pbi_trial.Report
  measure_table: MEASURES_
  measure_file: definition/tables/MEASURES_.tmdl
expected_measure_count: 46
comparison:
  integer_tolerance: EXACT
  decimal_tolerance: DECIMAL_1E-9
  required_slices:
    - OVERALL
    - DISTANCE
    - GENDER
    - EVENT
    - COUNTRY
    - DIVISION
    - AGE_GROUP
    - LEG
review_categories:
  - EXACT_CONVERSION
  - SNOWFLAKE_SUPPORTED_LOCAL_IR_GAP
  - SEMANTIC_TRAP
  - SNOWFLAKE_UNSUPPORTED
  - RELATIONSHIP_OR_CONTEXT_REVIEW
  - MANUAL_REVIEW_REQUIRED
