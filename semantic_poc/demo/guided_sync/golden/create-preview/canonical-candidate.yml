version: 2

models:
  - name: metricflow_time_spine
    description: Day-grain time spine required by dbt Semantic Layer validation.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date used by MetricFlow for time-grain expansion.
        granularity: day
        data_tests:
          - unique
          - not_null

  - name: sem_results_obt
    description: Semantic-facing result one-big-table for dbt Semantic Layer metrics. Direct athlete identifiers are intentionally excluded.
    columns:
      - name: result_id
        description: Stable surrogate key for one athlete result row.
        data_tests:
          - unique
          - not_null
      - name: event_id
        description: Race event key associated with the result row.
        data_tests:
          - not_null
      - name: event_year
        description: Date-valued year anchor derived from the event year for dbt Semantic Layer time grouping.

semantic_models:
  - name: triathlon_results
    description: Result-grain semantic model for triathlon result counts, split medians, and review-signal rates.
    model: ref('sem_results_obt')
    defaults:
      agg_time_dimension: event_year
    config:
      meta:
        semantic_contract:
          version: 1
          canonical_source: dbt_semantic_yaml
          snowflake_logical_tables:
            - name: results
              description: Athlete result fact table.
              base_table: fct_result
              primary_key: result_id
            - name: events
              description: Race event dimension.
              base_table: dim_event
              primary_key: event_id
            - name: divisions
              description: Athlete division dimension.
              base_table: dim_division
              primary_key: division_id
            - name: genders
              description: Gender dimension.
              base_table: dim_gender
              primary_key: gender_id
            - name: distances
              description: Nominal race distance dimension.
              base_table: dim_distance
              primary_key: distance_id
          relationships:
            - name: results_to_events
              from_table: fct_result
              from_column: event_id
              to_table: dim_event
              to_column: event_id
            - name: results_to_divisions
              from_table: fct_result
              from_column: division_id
              to_table: dim_division
              to_column: division_id
            - name: results_to_genders
              from_table: fct_result
              from_column: gender_id
              to_table: dim_gender
              to_column: gender_id
            - name: results_to_distances
              from_table: fct_result
              from_column: distance_id
              to_table: dim_distance
              to_column: distance_id
    entities:
      - name: result
        type: primary
        expr: result_id
      - name: event
        type: foreign
        expr: event_id
      - name: division_id
        label: Division
        type: foreign
        expr: division_id
      - name: gender_id
        label: Gender
        type: foreign
        expr: gender_id
      - name: distance_id
        label: Distance
        type: foreign
        expr: distance_id
    dimensions:
      - name: event_year
        type: time
        type_params:
          time_granularity: year
      - name: race_name
        type: categorical
      - name: distance
        type: categorical
      - name: gender
        type: categorical
      - name: division
        type: categorical
      - name: is_pro
        type: categorical
      - name: finish_status
        type: categorical
      - name: is_finisher
        type: categorical
      - name: is_valid_sbr_finisher
        type: categorical
      - name: any_review_flag
        type: categorical
        description: Broad review-signal flag. This is not an accusation.
      - name: event_context_flag
        type: categorical
        description: Indicates likely event-level course or recording context.
      - name: record_integrity_flag
        type: categorical
        description: Indicates strict row-level timing or arithmetic integrity review signals.
      - name: individual_profile_flag
        type: categorical
        description: Indicates unusual split-profile review signals after course-context handling.
      - name: model_residual_flag
        type: categorical
        description: Indicates model residual review signals.
      - name: individual_hard_flag
        type: categorical
        description: Indicates rows that remain hard-flag candidates after likely course-context cases are separated.
    measures:
      - name: result_rows
        description: Number of result rows under the current filter context.
        agg: sum
        expr: 1
      - name: finishers
        description: Number of result rows marked as finishers under the current filter context.
        agg: sum_boolean
        expr: is_finisher = 1
      - name: valid_sbr_finishers
        description: Number of finishers with valid gender and complete swim, bike, and run splits.
        agg: sum_boolean
        expr: finish_status = 'FIN' AND is_valid_sbr_finisher = 1
      - name: any_review_rows
        description: Number of valid result rows where at least one review-family flag is active.
        agg: sum_boolean
        expr: any_review_flag = 1
      - name: event_context_rows
        description: Number of result rows affected by event-leg course-context flags.
        agg: sum_boolean
        expr: event_context_flag = 1
      - name: record_integrity_rows
        description: Number of result rows with strict row-level timing or arithmetic integrity issues.
        agg: sum_boolean
        expr: record_integrity_flag = 1
      - name: individual_profile_rows
        description: Number of result rows with unusual swim-bike-run profile spread after course-context handling.
        agg: sum_boolean
        expr: individual_profile_flag = 1
      - name: model_residual_rows
        description: Number of result rows with model residual review flags.
        agg: sum_boolean
        expr: model_residual_flag = 1
      - name: individual_hard_flag_rows
        description: Number of rows that remain individual hard-flag candidates after likely course-context cases are separated.
        agg: sum_boolean
        expr: individual_hard_flag = 1
      - name: median_overall_seconds
        description: Median overall finish time in seconds.
        agg: median
        expr: overall_seconds
      - name: median_swim_seconds
        description: Median swim split time in seconds.
        agg: median
        expr: swim_seconds
      - name: median_bike_seconds
        description: Median bike split time in seconds.
        agg: median
        expr: bike_seconds
      - name: median_run_seconds
        description: Median run split time in seconds.
        agg: median
        expr: run_seconds
      - name: median_consistency_spread
        description: Median swim-bike-run relative percentile spread.
        agg: median
        expr: consistency_spread_rel

metrics:
  - name: result_rows
    label: Result Rows
    description: Number of result rows under the current filter context.
    type: simple
    type_params:
      measure: result_rows

  - name: finishers
    label: Finishers
    description: Number of result rows marked as finishers under the current filter context.
    type: simple
    type_params:
      measure: finishers

  - name: valid_sbr_finishers
    label: Valid SBR Finishers
    description: Number of finishers with valid gender and complete swim, bike, and run splits.
    type: simple
    type_params:
      measure: valid_sbr_finishers
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: whole_number
          caveat: Default denominator for athlete-level review rates.
        power_bi:
          table: tri_measures
          measure: Valid SBR Finishers
          format_string: "0"
        snowflake:
          logical_table: results
          metric_name: valid_sbr_finishers
          synonyms:
            - valid finishers
            - complete swim bike run finishers

  - name: any_review_rows
    label: Any Review Rows
    description: Number of rows where at least one review-family flag is active.
    type: simple
    type_params:
      measure: any_review_rows

  - name: event_context_rows
    label: Event Context Rows
    description: Number of result rows affected by event-leg course-context flags.
    type: simple
    type_params:
      measure: event_context_rows
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: whole_number
          caveat: Review flags are data-quality review signals and are not accusations.
        power_bi:
          table: tri_measures
          measure: Event Context Rows
          format_string: "0"
        snowflake:
          logical_table: results
          metric_name: event_context_rows
          synonyms:
            - course context rows
            - altered course rows

  - name: record_integrity_rows
    label: Record Integrity Rows
    description: Number of result rows with strict row-level timing or arithmetic integrity issues.
    type: simple
    type_params:
      measure: record_integrity_rows

  - name: individual_profile_rows
    label: Individual Profile Rows
    description: Number of result rows with unusual swim-bike-run profile spread after course-context handling.
    type: simple
    type_params:
      measure: individual_profile_rows

  - name: model_residual_rows
    label: Model Residual Rows
    description: Number of result rows with model residual review flags.
    type: simple
    type_params:
      measure: model_residual_rows

  - name: individual_hard_flag_rows
    label: Individual Hard Flag Rows
    description: Number of rows that remain individual hard-flag candidates after likely course-context cases are separated.
    type: simple
    type_params:
      measure: individual_hard_flag_rows

  - name: review_flag_rate
    label: Review Flag Rate
    description: Share of valid SBR finishers where at least one review-family flag is active.
    type: ratio
    type_params:
      numerator: any_review_rows
      denominator: valid_sbr_finishers

  - name: event_context_rate
    label: Event Context Rate
    description: Share of valid SBR finishers affected by event-leg course-context flags.
    type: ratio
    type_params:
      numerator: event_context_rows
      denominator: valid_sbr_finishers
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: percentage_1_decimal
          caveat: Review flags are data-quality review signals and are not accusations.
        power_bi:
          table: tri_measures
          measure: Event Context Rate
          format_string: "0.0%"
          display_folder: "03 Rates"
        snowflake:
          logical_table: results
          metric_name: event_context_rate
          synonyms:
            - course context rate
            - altered course rate

  - name: record_integrity_rate
    label: Record Integrity Rate
    description: Share of valid SBR finishers with strict row-level timing or arithmetic integrity issues.
    type: ratio
    type_params:
      numerator: record_integrity_rows
      denominator: valid_sbr_finishers
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: percentage_1_decimal
          caveat: Review flags are data-quality review signals and are not accusations.
        power_bi:
          table: tri_measures
          measure: Record Integrity Rate
          format_string: "0.0%"
          display_folder: "03 Rates"
        snowflake:
          logical_table: results
          metric_name: record_integrity_rate
          synonyms:
            - record quality rate
            - timing integrity rate

  - name: individual_profile_rate
    label: Individual Profile Rate
    description: Share of valid SBR finishers with unusual swim-bike-run profile spread after course-context handling.
    type: ratio
    type_params:
      numerator: individual_profile_rows
      denominator: valid_sbr_finishers
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: percentage_1_decimal
          caveat: Review flags are data-quality review signals and are not accusations.
        power_bi:
          table: tri_measures
          measure: Individual Profile Rate
          format_string: "0.0%"
          display_folder: "03 Rates"
        snowflake:
          logical_table: results
          metric_name: individual_profile_rate
          synonyms:
            - split profile rate
            - individual review profile rate

  - name: model_residual_rate
    label: Model Residual Rate
    description: Share of valid SBR finishers with model residual review flags.
    type: ratio
    type_params:
      numerator: model_residual_rows
      denominator: valid_sbr_finishers
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: percentage_1_decimal
          caveat: Review flags are data-quality review signals and are not accusations.
        power_bi:
          table: tri_measures
          measure: Model Residual Rate
          format_string: "0.0%"
          display_folder: "03 Rates"
        snowflake:
          logical_table: results
          metric_name: model_residual_rate
          synonyms:
            - residual review rate
            - model review rate

  - name: individual_hard_flag_rate
    label: Individual Hard Flag Rate
    description: Share of valid SBR finishers that remain individual hard-flag candidates after likely course-context cases are separated.
    type: ratio
    type_params:
      numerator: individual_hard_flag_rows
      denominator: valid_sbr_finishers
    config:
      meta:
        semantic_contract:
          version: 1
          public: true
          format: percentage_1_decimal
          caveat: Review flags are data-quality review signals and are not accusations.
        power_bi:
          table: tri_measures
          measure: Individual Hard Flag Rate
          format_string: "0.0%"
          display_folder: "03 Rates"
        snowflake:
          logical_table: results
          metric_name: individual_hard_flag_rate
          synonyms:
            - hard flag rate
            - individual hard review rate
